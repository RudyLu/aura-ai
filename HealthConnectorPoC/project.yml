name: HealthConnectorPoC
options:
  bundleIdPrefix: com.rudy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    ENABLE_DEBUG_DYLIB: NO
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
targets:
  HealthConnectorPoC:
    type: application
    platform: iOS
    sources: [HealthConnectorPoC]
    entitlements:
      path: HealthConnectorPoC/HealthConnectorPoC.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        # Universal links (https://<host>/link/<token>); the server needs APPLE_TEAM_ID.
        com.apple.developer.associated-domains:
          - applinks:aura-web-664697749037.us-central1.run.app
    info:
      path: HealthConnectorPoC/Info.plist
      properties:
        CFBundleDisplayName: Health PoC
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # aura://link?t=<token>&h=<origin> from the Aura web app
        CFBundleURLTypes:
          - CFBundleURLName: com.rudy.healthconnectorpoc.aura
            CFBundleURLSchemes: [aura]
        # Local dev server (http://localhost:3000, *.local); production is HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHealthShareUsageDescription: "PoC: reads sleep, menstrual, diet, vitals and activity samples to test data-collection feasibility."
        NSHealthUpdateUsageDescription: "PoC (simulator only): writes synthetic sample data for testing."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rudy.healthconnectorpoc
        TARGETED_DEVICE_FAMILY: "1"
